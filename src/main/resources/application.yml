spring:
  application:
    name: bitterlife-backend

  datasource:
    url: jdbc:mysql://localhost:3306/bitterlife_db?serverTimezone=Asia/Seoul
    username: ${SPRING_DATASOURCE_USERNAME:bitterlife_user}
    password: ${SPRING_DATASOURCE_PASSWORD:bitterlife_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3000ms

# AI 서비스 URL
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

# 로깅 설정
logging:
  level:
    com.starter: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Redis Configuration
redis:
  enabled: ${REDIS_ENABLED:false}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Kakao Local API Configuration
kakao:
  api:
    key: ${KAKAO_REST_API_KEY:test-api-key-for-development}
    base-url: https://dapi.kakao.com
    timeout: 5000

# Claude AI Configuration
claude:
  api:
    key: ${CLAUDE_API_KEY:test-api-key-for-development}
    model: claude-sonnet-4-20250514
    timeout: 30000
    max-tokens: 4096

# Langfuse Configuration
langfuse:
  api:
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    base-url: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}

# OpenTelemetry Configuration for Langfuse
management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}/api/public/otel/v1/traces
      headers:
        Authorization: Basic ${LANGFUSE_AUTH_STRING:}

# Sentry Configuration
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:development}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:1.0}
  send-default-pii: false
  enable-tracing: true
  logging:
    minimum-event-level: warn
    minimum-breadcrumb-level: info

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      claudeApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  timelimiter:
    instances:
      claudeApi:
        timeoutDuration: 30s
